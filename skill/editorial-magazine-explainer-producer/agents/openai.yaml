interface:
  display_name: "教培杂志插画语义图解"
  short_description: "导演故事板先选对画面，再当天做完高质量教培杂志动画"
  default_prompt: "Use $editorial-magazine-explainer-producer with one approved golden baseline, one director, and one timeline owner. Start the same-day production clock only after the locked script, evidence pack, and final narration are ready. Do not target a fixed chapter or shot count. First present a plain-language director interpretation and a complete 9:16 visual storyboard covering the full narration. For every comprehensible visual segment, choose image-to-video for people, situations, humor, space, and non-data ideas; native MG as the exact data/text backbone; VOX-style editorial layers for methods, paths, causality, and object handoffs; real official pages/PDFs/screenshots or sourced charts for factual evidence. Official evidence must enter through the same design carrier and transitions, never as raw full-screen browser UI. Never use generated empty cards plus detached overlay text. Keep each image-to-video clip at 10 seconds or less unless the user explicitly approves an exception, and probe real media duration before composition. Create a new no-vocals BGM for every project, check the all-project BGM registry, and include the new track in the full voiced animatic. Do not batch-generate until the user approves the storyboard, full voiced animatic, and hardest 15-20 second real-quality motion pilot, with current-board brand and technical signoff. Preserve the locked caption style, approved voice profile, mobile readability, brand ending, full QA, and separate publication authorization."
